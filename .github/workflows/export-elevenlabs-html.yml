name: Export ElevenLabs HTML

on:
  push:
    branches:
      - main
    paths:
      - 'OCC_kb_pack/**/*.md'
      - 'OCC_kb_pack/09_HTML_EXPORT/convert_markdown_to_html.py'
      - '.github/workflows/export-elevenlabs-html.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-elevenlabs-html-main
  cancel-in-progress: true

jobs:
  export-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Clean existing HTML export
        run: rm -rf OCC_kb_pack/09_HTML_EXPORT/html

      - name: Convert Markdown KB to HTML
        run: python OCC_kb_pack/09_HTML_EXPORT/convert_markdown_to_html.py

      - name: Show export result
        run: |
          echo "HTML file count:"
          find OCC_kb_pack/09_HTML_EXPORT/html -type f -name '*.html' | wc -l
          echo "Top-level export folders:"
          find OCC_kb_pack/09_HTML_EXPORT/html -maxdepth 1 -mindepth 1 -type d -print | sort

      - name: Commit exported HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A OCC_kb_pack/09_HTML_EXPORT/html
          if git diff --cached --quiet; then
            echo "No HTML export changes."
          else
            git commit -m "Export rebuilt KB to ElevenLabs HTML"
            git pull --rebase origin main
            git push
          fi
